name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

# A newer push to the same ref makes an in-flight run obsolete. This job installs the
# Android platform and builds a debug APK, which is among the slower things in the org, so
# a superseded run should return its runner rather than finish a result nobody reads.
#
# Keyed on the PR number when there is one, so a push to a branch and the pull_request run
# for that same branch do not cancel each other.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    # This repo is checked out into app/ so the UI checkout below can be its SIBLING rather
    # than living inside our tree. Anything that walks the working directory - `node --test`
    # discovering test files, a glob in a build script - would otherwise pick the UI repo up
    # as if it were ours, and run it with the wrong working directory.
    defaults:
      run:
        working-directory: app

    steps:
      - uses: actions/checkout@v4
        with:
          path: app

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: app/package-lock.json

      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # A sibling of app/, never inside it. See the defaults block above.
      - name: Check out the UI repo for the user-agent contract
        uses: actions/checkout@v4
        with:
          repository: HoffmanEngineering/3d-print-log-ui
          path: print-log-ui

      - name: Install dependencies
        run: npm ci

      # config.xml's OverrideUserAgent and the UI's CORDOVA_USER_AGENT must stay identical.
      # Drift disables every Cordova-only behavior in the shipped app - push registration
      # included - and nothing errors, so only this check catches it.
      - name: Verify the user agent contract
        env:
          PRINT_LOG_UI_PATH: ../print-log-ui
        run: node scripts/check-user-agent-contract.mjs

      - name: Run hook and contract tests
        run: npm test

      # The Android build fails at :app:processDebugGoogleServices without this. It is
      # Firebase client config rather than a credential, but it identifies the project, so
      # it is injected the same way build.json is rather than committed.
      - name: Write google-services.json
        run: echo "${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}" | base64 -d > google-services.json

      - name: Add Android platform
        run: npx cordova platform add android@15.1.0

      - name: Build debug APK
        run: npm run build:android

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: debug-apk
          # Relative to the workspace, not to defaults.working-directory: this is an
          # action input rather than a run step.
          path: app/platforms/android/app/build/outputs/apk/debug/*.apk
          retention-days: 14
          if-no-files-found: error

  # An unsigned simulator build, so a change that breaks iOS fails its PR rather than the
  # first tagged release. Signing and TestFlight belong to release.yml (#28). macOS runners
  # are free here only because this repo is public.
  #
  # No UI checkout and no Firebase secret: the user-agent contract and the tests already run
  # in the build job, and cordova-plugin-firebasex-core ships a placeholder
  # GoogleService-Info.plist that is enough to compile (it only warns that the real one is
  # missing).
  ios:
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Show Xcode version
        run: xcodebuild -version

      # The bridge router has no UIKit, WebKit or Cordova in it, so it compiles and runs on
      # its own with plain swiftc, the way the Java helpers are tested with javac.
      - name: Test the Swift bridge router
        run: |
          SRC=plugins-local/cordova-plugin-printlog-native/src/ios
          swiftc -o "$RUNNER_TEMP/router-tests" "$SRC/PrintLogBridgeRouter.swift" test/ios/main.swift
          "$RUNNER_TEMP/router-tests"

      - name: Install dependencies
        run: npm ci

      # Must be a fresh add. cordova-ios 8.1.1's prepare only rewrites the plugins
      # package's `.iOS(.vNN)` form, so on an existing platform a deployment-target change
      # in config.xml never reaches it; create writes it correctly.
      - name: Add iOS platform
        run: npx cordova platform add ios@8.1.1

      - name: Build for the simulator
        run: npx cordova build ios --emulator
