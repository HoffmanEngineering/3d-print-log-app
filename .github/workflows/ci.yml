name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

# A newer push to the same ref makes an in-flight run obsolete. This job installs the
# Android platform and builds a debug APK, which is among the slower things in the org, so
# a superseded run should return its runner rather than finish a result nobody reads.
#
# Keyed on the PR number when there is one, so a push to a branch and the pull_request run
# for that same branch do not cancel each other.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install dependencies
        run: npm ci

      - name: Add Android platform
        run: npx cordova platform add android@14.0.1

      - name: Build debug APK
        run: npm run build:android

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: debug-apk
          path: platforms/android/app/build/outputs/apk/debug/*.apk
          retention-days: 14
          if-no-files-found: error
