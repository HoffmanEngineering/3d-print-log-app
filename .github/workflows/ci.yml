name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

# A newer push to the same ref makes an in-flight run obsolete. This job installs the
# Android platform and builds a debug APK, which is among the slower things in the org, so
# a superseded run should return its runner rather than finish a result nobody reads.
#
# Keyed on the PR number when there is one, so a push to a branch and the pull_request run
# for that same branch do not cancel each other.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Check out the UI repo for the user-agent contract
        uses: actions/checkout@v4
        with:
          repository: HoffmanEngineering/3d-print-log-ui
          path: print-log-ui

      - name: Install dependencies
        run: npm ci

      # config.xml's OverrideUserAgent and the UI's CORDOVA_USER_AGENT must stay identical.
      # Drift disables every Cordova-only behaviour in the shipped app - push registration
      # included - and nothing errors, so only this check catches it.
      - name: Verify the user agent contract
        env:
          PRINT_LOG_UI_PATH: print-log-ui
        run: node scripts/check-user-agent-contract.mjs

      - name: Run hook and contract tests
        run: npm test

      # The Android build fails at :app:processDebugGoogleServices without this. It is
      # Firebase client config rather than a credential, but it identifies the project, so
      # it is injected the same way build.json is rather than committed.
      - name: Write google-services.json
        run: echo "${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}" | base64 -d > google-services.json

      - name: Add Android platform
        run: npx cordova platform add android@15.1.0

      - name: Build debug APK
        run: npm run build:android

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: debug-apk
          path: platforms/android/app/build/outputs/apk/debug/*.apk
          retention-days: 14
          if-no-files-found: error
