name: Release

on:
  push:
    tags:
      - 'v*'

# Read-only by default; the release job widens it for itself below. Deliberately no
# concurrency group here -- cancelling a tagged release part-way through signing is worse
# than letting two run.
permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    # Gates the signing keystore behind an approval, which is the point: the secrets in
    # this job produce a bundle that can be published to Play. Unlike the web app there is
    # no value in splitting a build job out ahead of the gate, because the build IS the
    # thing that needs the secrets.
    environment: production

    # Scoped to this job so a future job added to this workflow does not inherit write
    # access. softprops/action-gh-release needs it to create the release and upload the aab.
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install dependencies
        run: npm ci

      # The Android build fails at :app:processReleaseGoogleServices without this. Firebase
      # client config rather than a credential, but it identifies the project, so it is
      # injected from the production environment the same way build.json is.
      - name: Write google-services.json
        env:
          GOOGLE_SERVICES_B64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: printf '%s' "$GOOGLE_SERVICES_B64" | base64 -d > google-services.json

      - name: Add Android platform
        run: npx cordova platform add android@15.1.0

      - name: Decode keystore
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: printf '%s' "$KEYSTORE_B64" | base64 -d > keystore.jks

      - name: Write build.json
        env:
          STORE_PW: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PW: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          jq -n \
            --arg pw  "$STORE_PW" \
            --arg al  "$KEY_ALIAS" \
            --arg kpw "$KEY_PW" \
            '{android:{release:{keystore:"keystore.jks",storePassword:$pw,alias:$al,password:$kpw,packageType:"bundle"}}}' \
            > build.json

      - name: Build signed bundle
        run: npm run release:android

      - name: Verify the bundle was signed
        run: |
          AAB=$(ls platforms/android/app/build/outputs/bundle/release/*.aab)
          echo "Built: $AAB"
          unzip -l "$AAB" | grep -q 'META-INF/.*\.RSA\|META-INF/.*\.EC' \
            && echo "signature block present" \
            || (echo "ERROR: bundle is not signed" && exit 1)

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          files: platforms/android/app/build/outputs/bundle/release/*.aab
          generate_release_notes: true

      - name: Clean up signing material
        if: always()
        run: rm -f keystore.jks build.json google-services.json
