name: Bug Report
description: Something isn't working correctly
labels: ['bug']
body:
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: A clear description of the bug
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open the app and ...
        2. Tap ...
        3. See error ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Device
      placeholder: e.g. Pixel 7, Samsung Galaxy S23
    validations:
      required: true
  - type: input
    id: android_version
    attributes:
      label: Android version
      placeholder: e.g. Android 14
    validations:
      required: true
  - type: input
    id: app_version
    attributes:
      label: App version
      description: Found in the Play Store listing, or the version in config.xml if you built it yourself
      placeholder: e.g. 1.1.6
  - type: dropdown
    id: install_source
    attributes:
      label: How did you install the app?
      options:
        - Google Play Store
        - Sideloaded a build myself
        - Built from source
    validations:
      required: true
  - type: textarea
    id: web_or_native
    attributes:
      label: Does it also happen at www.3dprintlog.com in a mobile browser?
      description: This app wraps the web UI, so this tells us which repo the bug belongs in. "Didn't check" is a fine answer.
